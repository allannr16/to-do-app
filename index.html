# to-do-app
desafio de criação de agenda de tarefa
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Acadêmica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Minhas Tarefas</h1>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Descrição da tarefa...">
            <select id="priorityInput">
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa" selected>Baixa</option>
            </select>
            <button id="addBtn">Adicionar</button>
        </div>

        <div class="filter-group">
            <label for="sortSelect">Organizar por:</label>
            <select id="sortSelect">
                <option value="criacao">Ordem de Criação</option>
                <option value="alta-baixa">Prioridade (Alta -> Baixa)</option>
                <option value="baixa-alta">Prioridade (Baixa -> Alta)</option>
                <option value="aleatoria">Aleatória</option>
            </select>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
